name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Required so electron-builder can POST /releases via GITHUB_TOKEN.
# GitHub Actions defaults GITHUB_TOKEN to read-only since 2023; releases need contents=write.
permissions:
  contents: write

env:
  NODE_VERSION: '24'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # scripts/build-snaca.js compiles the in-tree `snaca/` Rust workspace,
      # which requires rust >= 1.88 (snaca/Cargo.toml). Pin it explicitly so
      # packaging doesn't depend on whatever the runner happens to ship.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Checkout academic-research-skills (SNACA bundled skills source)
        uses: actions/checkout@v4
        with:
          repository: Imbad0202/academic-research-skills
          path: academic-research-skills-src

      - name: Build and Package
        run: npm run build:win -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.SCIPEN_STUDIO_RELEASE }}
          # Override copy-skills.js default location (../academic-research-skills,
          # outside $GITHUB_WORKSPACE) — actions/checkout can only place repos
          # under workspace, so we point the script at the checked-out copy.
          ARS_SKILLS_DIR: ${{ github.workspace }}/academic-research-skills-src

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/*.exe
            release/*.zip
            release/latest.yml
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rust >= 1.88 for the snaca workspace; the universal2 build also needs
      # both apple targets (build-snaca.js runs `rustup target add`, but pin
      # them here so the toolchain is ready before packaging).
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Checkout academic-research-skills (SNACA bundled skills source)
        uses: actions/checkout@v4
        with:
          repository: Imbad0202/academic-research-skills
          path: academic-research-skills-src

      - name: Build and Package
        run: npm run build:mac -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.SCIPEN_STUDIO_RELEASE }}
          ARS_SKILLS_DIR: ${{ github.workspace }}/academic-research-skills-src

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rust >= 1.88 for the in-tree snaca workspace.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # selection-hook v2 added Linux support (X11/Wayland); its native build needs these headers.
      - name: Install Linux native build deps (selection-hook)
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxfixes-dev libevdev-dev libwayland-dev

      - name: Install dependencies
        run: npm ci

      - name: Checkout academic-research-skills (SNACA bundled skills source)
        uses: actions/checkout@v4
        with:
          repository: Imbad0202/academic-research-skills
          path: academic-research-skills-src

      - name: Build and Package
        run: npm run build:linux -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.SCIPEN_STUDIO_RELEASE }}
          ARS_SKILLS_DIR: ${{ github.workspace }}/academic-research-skills-src

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error
